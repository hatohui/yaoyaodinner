name: backend-cd

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

env:
  AWS_REGION: "ap-southeast-1"
  LAMBDA_FUNCTION_NAME: "yaoyao-function"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Run database migrations
        working-directory: backend
        run: bun run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --cache-from $ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f backend/Dockerfile \
            -t $ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:latest \
            backend/
          docker push $ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:latest
          echo "image=$ECR_REGISTRY/${{ env.LAMBDA_FUNCTION_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.build.outputs.image }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
