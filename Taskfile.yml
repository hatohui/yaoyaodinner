version: "3"

vars:
  COMPOSE: docker compose -f backend/docker-compose.yaml
  EXEC: docker exec yaoyao-api
  REDIS_EXEC: docker exec yaoyao-redis redis-cli -a pass

tasks:
  setup:
    desc: Install dependencies for both frontend and backend
    cmds:
      - "cd frontend && bun install"
      - "cd backend && bun install"
      - "cp backend/.env.example backend/.env"
      - "cp frontend/.env.example frontend/.env"
      - "cd infra && terraform init"

  frontend:
    aliases:
      - f
    desc: Start the frontend development server
    cmd: "cd frontend && bun run dev"
  # ── Docker ───────────────────────────────────────────────────────────────────

  generate:
    desc: Generate orval code from OpenAPI spec
    cmd: "cd frontend && bun run api:generate"

  backend:
    aliases:
      - b
    desc: Start the backend development server
    cmd: "cd backend && bun run dev"

  backend:infra:
    aliases:
      - b:infra
    desc: Start all containers
    cmd: "{{.COMPOSE}} up -d"

  backend:stop:
    aliases:
      - bs:infra
    desc: Stop all containers
    cmd: "{{.COMPOSE}} down"

  build:
    aliases:
      - b:infra
    desc: Rebuild the api image and restart
    cmds:
      - "{{.COMPOSE}} build api"
      - "{{.COMPOSE}} up -d api"

  # ── Database ─────────────────────────────────────────────────────────────────

  db:apply:
    desc: Apply pending migrations
    cmds:
      - "cd backend && bunx prisma migrate deploy"
      - "cd backend && bunx prisma generate"

  db:reset:
    desc: Reset DB and re-apply all migrations (destroys data)
    cmd: "cd backend && bunx prisma migrate reset --force"

  db:seed:
    aliases:
      - seed
    desc: Seed core data (alias of `task seed`)
    cmd: "cd backend && bunx prisma db seed"

  db:seed:sample:
    aliases:
      - seed:sample
    desc: Seed sample data (alias of `task seed -- --with-sample-data`)
    cmd: "cd backend && bunx prisma db seed -- --with-sample-data"

  db:fresh:
    desc: Reset DB, apply migrations, and seed core + sample data
    cmds:
      - task: db:reset
      - "cd backend && bunx prisma db seed -- --with-sample-data"

  db:migrate:
    desc: Create a new migration
    cmd: "cd backend && bunx prisma migrate dev --name {{.NAME}}"

  # ── Redis ────────────────────────────────────────────────────────────────────

  redis:flush:
    desc: Flush all Redis cache
    cmd: "{{.REDIS_EXEC}} FLUSHALL"

  redis:keys:
    desc: List all Redis keys
    cmd: "{{.REDIS_EXEC}} KEYS '*'"

  infra:apply:
    desc: Apply Terraform configuration
    cmd: "cd infra && doppler run terraform apply"
